[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-programs"
version = "0.1.0"
description = "Learning and evolving compression and steering harness programs with agentic RL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "TBD" }
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
# Exact token counts for sizing (chat_template_counter) and the training bridge.
tokenizer = ["transformers>=4.45"]
# Stage 2 training. The bridge targets verl's agent loop; see docs/rl.md for the tested version.
rl = ["verl", "transformers>=4.45", "torch", "pandas", "pyarrow"]
# The ALFWorld environment (plus its game data; see docs/domains.md).
alfworld = ["alfworld"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["harness_programs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
